<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Skeleton</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="page-title">Main Categories</h1>
    <button id="back-button" style="display: none;">Back to Categories</button>

    <div id="main-card-container" class="card-container">
        <!-- 8 main category cards will be generated here by script.js -->
    </div>

    <div id="sub-card-container" class="card-container" style="display: none;">
        <!-- 20 sub-cards will be generated here by script.js -->
    </div>

    <script src="script.js"></script>
</body>
</html>
